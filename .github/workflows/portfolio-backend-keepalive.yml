name: Portfolio Backend Keepalive

on:
  schedule:
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-backend-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend without creating a lead
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Origin: https://marcileii.github.io' \
            --header 'Content-Type: application/json' \
            --data '{"healthcheck":"portfolio-backend"}' \
            'https://qojhrihrfkoztetxpjgp.supabase.co/functions/v1/portfolio-lead')
          echo "$response"
          [[ "$response" == *'"health":true'* ]]
