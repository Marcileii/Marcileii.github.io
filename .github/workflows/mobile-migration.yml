name: Apply mobile UX migration

on:
  push:
    branches: [feature/mobile-ux]
    paths:
      - tools/apply_mobile_ux.py
      - .github/workflows/mobile-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/mobile-ux

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply mobile UX migration
        run: python tools/apply_mobile_ux.py

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/aurora-estetica/index.html demos/nexo-contabil/index.html demos/cafe-atelier/index.html demos/vista-imoveis/index.html demos/atlas/index.html demos/leadflow/index.html
          git commit -m "feat: aplica UX mobile nas demos"
          git push origin HEAD:feature/mobile-ux
